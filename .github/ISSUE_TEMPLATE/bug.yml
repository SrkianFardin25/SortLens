name: Bug report
description: Something does not work as the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never attach private photos. If a file was lost or changed, also email the maintainer (see SECURITY.md)."
  - type: textarea
    id: what
    attributes: {label: What happened?, description: And what you expected instead.}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, placeholder: "1. sortlens import-takeout ...\n2. ..."}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes: {label: Output of `sortlens doctor`, render: text}
  - type: input
    id: os
    attributes: {label: OS and computer, placeholder: "Windows 11, i3 12th gen, 8 GB RAM"}
    validations: {required: true}
